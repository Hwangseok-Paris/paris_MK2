<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
#split-home{--paper:light-dark(#f5f4ef,#17191b);--ink:light-dark(#22282d,#eeede7);--quiet:light-dark(#62686c,#aeb3b6);--accent:light-dark(#b93828,#ed8773);container:split / inline-size;background:var(--paper);color:var(--ink);font-family:Pretendard,sans-serif;letter-spacing:-.015em;width:100%}
#split-home *{box-sizing:border-box;min-width:0}
#split-home .layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8%;padding:100px 6% 72px;align-items:center;min-height:640px}
#split-home :is(h1,h2,p){margin:0}
#split-home h1{font:600 clamp(30px,4.8cqw,52px)/1.12 'Chakra Petch',sans-serif;letter-spacing:-.035em}
#split-home .job{font:600 18px/1.4 'Chakra Petch',sans-serif;margin-top:10px;color:var(--quiet)}
#split-home .bio{font-size:16px;line-height:1.8;word-break:keep-all;overflow-wrap:break-word;margin-top:28px;max-width:480px}
#split-home .featured{margin-top:38px}
#split-home h2{font-size:12px;font-weight:400;color:var(--quiet);margin-bottom:12px}
#split-home .work{display:flex;flex-direction:column;align-items:flex-start;gap:0}
#split-home button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;text-align:left;padding:0}
#split-home .work button{font-size:14px;line-height:1.7;min-height:34px}
#split-home .email{display:inline-flex;align-items:center;gap:8px;color:var(--quiet);font-size:12px;min-height:44px;margin-top:30px;overflow-wrap:anywhere;text-decoration:none}
#split-home .menu{display:flex;flex-direction:column;gap:18px;align-self:center}
#split-home .menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;font:500 clamp(32px,5.6cqw,62px)/1.3 'Chakra Petch',sans-serif;letter-spacing:-.04em;min-height:70px;transition:color .25s,transform .25s}
#split-home .menu .arrow{font-family:Pretendard,sans-serif;font-size:26px;opacity:0;transform:translateX(-10px);transition:opacity .25s,transform .25s}
#split-home :is(h1,.job,.featured,.email){transition:color .25s,transform .25s}
#split-home[data-active="about"] :is(h1,.job),#split-home[data-active="projects"] .featured,#split-home[data-active="contact"] .email{color:var(--accent)}
#split-home[data-active="projects"] .featured{transform:translateX(5px)}
#split-home[data-active="contact"] .email{text-decoration:underline;text-underline-offset:6px}
#split-home .menu button.is-active{color:var(--accent);transform:translateX(8px)}
#split-home .menu button.is-active .arrow{opacity:1;transform:translateX(0)}
#split-home :is(button,a):focus-visible{outline:2px solid currentColor;outline-offset:6px}
#split-home .work button:hover{text-decoration:underline;text-underline-offset:4px}
@container split (max-width:650px){#split-home .layout{grid-template-columns:1fr;gap:42px;padding:64px 24px 40px;min-height:0}#split-home h1{font-size:clamp(30px,8cqw,44px)}#split-home .bio{font-size:15px}#split-home .job{font-size:16px}#split-home .menu{gap:4px}#split-home .menu button{font-size:36px;min-height:62px}#split-home .menu .arrow{opacity:1;transform:none;font-size:22px}#split-home .work button{min-height:44px}}
@media(prefers-reduced-motion:reduce){#split-home *,#split-home .menu .arrow{transition:none!important;transform:none!important}}
</style>
<div id="split-home" aria-label="소개와 우측 세로 메뉴 홈 시안">
<div class="layout">
<div class="left">
<section aria-labelledby="split-name"><h1 id="split-name">Hwangseok Kim</h1><p class="job">Frontend Developer</p><p class="bio">상담 서비스와 데이터 분석·검수 도구의 화면 구조와 기능을 설계하고 개발해 왔습니다. 직접 개발하면서 기획·디자인·백엔드와 구현 방향을 협의하고, 프로젝트에 따라 개발팀을 이끌며 업무와 기술 방향을 조율했습니다.</p></section>
<section class="featured" aria-labelledby="split-featured"><h2 id="split-featured">Featured</h2><div class="work"><button type="button" data-area="projects">삼성전자 Content Intelligence AI</button><button type="button" data-area="projects">오스템 모바일 앱 프레임워크</button><button type="button" data-area="projects">NH투자증권 챗봇</button></div></section>
<a class="email" href="mailto:hwangseokparis@gmail.com">hwangseokparis@gmail.com <span aria-hidden="true">↗</span></a>
</div>
<nav class="menu" aria-label="페이지 메뉴 시안"><button type="button" data-area="about">About<span class="arrow" aria-hidden="true">↗</span></button><button type="button" data-area="projects">Projects<span class="arrow" aria-hidden="true">↗</span></button><button type="button" data-area="contact">Contact<span class="arrow" aria-hidden="true">↗</span></button></nav>
</div></div>
<script>
(()=>{const root=document.getElementById('split-home');const menu=[...root.querySelectorAll('.menu button')];function activate(area){root.dataset.active=area;menu.forEach(b=>b.classList.toggle('is-active',b.dataset.area===area))}root.querySelectorAll('[data-area]').forEach(b=>{b.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')activate(b.dataset.area)});b.addEventListener('pointerleave',()=>activate(''));b.addEventListener('focus',()=>activate(b.dataset.area));b.addEventListener('blur',()=>activate(''));b.addEventListener('click',()=>activate(b.dataset.area))});const state={left:60,effect:'',mobile:false};function render(){root.style.maxWidth=state.mobile?'390px':'none';root.style.marginInline='auto';root.querySelector('.layout').style.setProperty('grid-template-columns',state.mobile?'1fr':`minmax(0,${state.left/40}fr) minmax(0,${(100-state.left)/40}fr)`);if(!state.mobile)root.querySelector('.layout').style.removeProperty('grid-template-columns');activate(state.effect)}if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.style.setProperty('--split-left',state.left+'%');render()}});t.addSelect(state,'effect',{label:'강조 상태',options:[{label:'기본',value:''},{label:'About',value:'about'},{label:'Projects',value:'projects'},{label:'Contact',value:'contact'}]});t.addToggle(state,'mobile',{label:'모바일 보기'})}})();
</script>
